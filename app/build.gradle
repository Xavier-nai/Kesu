plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xavier.kesu'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xavier.kesu'
        minSdk 33
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

